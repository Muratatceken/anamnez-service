[project]
name = "anamnez-service"
version = "1.1.0"
description = "KVKK uyumlu, kapalı devre tıbbi form anonimizasyon + sınıflandırma servisi"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.26", "pillow>=11", "pyyaml>=6", "pydantic>=2.7",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gliner = ["gliner>=0.2.13"]
ui = ["gradio>=5,<6", "pytesseract>=0.3.13"]   # eski Gradio aracı (src/app.py)

[project.scripts]
anamnez-service = "service.__main__:main"

[tool.setuptools]
packages = ["service", "service.backends", "service.anonymization", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
