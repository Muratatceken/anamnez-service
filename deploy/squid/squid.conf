# Egress proxy — sunucudan dışarı çıkan TEK yol. Yalnızca Anthropic API'ye CONNECT (443) izinlidir.
http_port 3128
acl llm_api dstdomain api.anthropic.com generativelanguage.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT llm_api SSL_ports
http_access deny all
# Loglarda URL/istek gövdesi tutulmaz (CONNECT tüneli zaten şifreli); yalnızca hedef+durum
logformat minimal %ts %>a %Ss/%03>Hs %rm %ru
access_log stdio:/var/log/squid/access.log minimal
cache deny all
via off
forwarded_for delete
