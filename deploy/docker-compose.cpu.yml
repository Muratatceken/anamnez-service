# Hibrit dağıtım — GPU'SUZ sunucu (CPU) + Claude API
#
#   api          : OCR + GLiNER NER + regex + kapı + egress gateway — YALNIZCA 'internal' ağda (internete ROTASI YOK)
#   egress-proxy : squid (internal+edge), yalnızca api.anthropic.com:443'e CONNECT — sunucunun tek çıkış noktası
#   ingress      : nginx (internal+edge), iç ağdan 8080'i api'ye iletir (Docker internal ağda port publish desteklenmez)
#
# İki bağımsız engel: (1) Docker: api'nin internal ağ dışına rotası yok; (2) nftables (deploy/nftables.cpu.conf):
# yalnızca proxy (10.200.2.20) 443/53'e çıkabilir. Mac/Windows Docker Desktop'ta (nftables yok) 1. engel tek başına yeter.
#
#   openssl rand -hex 32 > deploy/api_key.txt ; echo "sk-ant-..." > deploy/anthropic_key.txt
#   API_BIND=10.0.0.5 docker compose -f deploy/docker-compose.cpu.yml up -d

name: anamnez-hybrid

networks:
  internal:
    driver: bridge
    internal: true            # ← api burada; dışarı rota yok
    ipam:
      config: [{ subnet: 10.200.1.0/24 }]
  edge:
    driver: bridge
    ipam:
      config: [{ subnet: 10.200.2.0/24 }]

volumes:
  service-data:

services:
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 10.200.1.20
      edge:
        ipv4_address: 10.200.2.20
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "${API_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./nginx/ingress.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=128m     # gövde tamponu tmpfs'te (diske inmez)
      - /var/run
    security_opt: [no-new-privileges:true]
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: anamnez-service:1.2.0
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 10.200.1.10
    depends_on:
      egress-proxy: { condition: service_healthy }
    stop_grace_period: 60s
    environment:
      ANAMNEZ_SERVER__HOST: "0.0.0.0"
      ANAMNEZ_SERVER__API_KEY_FILE: "/run/secrets/api_key"
      ANAMNEZ_STORAGE__DB_PATH: "/data/service.db"
      ANAMNEZ_STORAGE__EGRESS_AUDIT_DB: "/data/egress_audit.db"
      ANAMNEZ_OCR__BACKEND: "tesseract"
      ANAMNEZ_LLM__ENABLED: "false"                 # lokal LLM yok (CPU)
      ANAMNEZ_ANONYMIZATION__ENGINE: "ner+regex"
      ANAMNEZ_ANONYMIZATION__NER__MODEL_PATH: "/models/neonredact-tr"
      ANAMNEZ_CLOUD__ENABLED: "true"
      ANAMNEZ_CLOUD__PROVIDER: "anthropic"
      ANAMNEZ_CLOUD__MODEL: "claude-opus-5"
      ANAMNEZ_CLOUD__API_KEY_FILE: "/run/secrets/anthropic_key"
      ANAMNEZ_CLOUD__PROXY: "http://10.200.1.20:3128"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
    secrets: [api_key, anthropic_key]
    volumes:
      - service-data:/data
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 6g }

secrets:
  api_key:
    file: ./api_key.txt
  anthropic_key:
    file: ./anthropic_key.txt
