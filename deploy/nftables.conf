#!/usr/sbin/nft -f
# Kapalı devre host güvenlik duvarı — Linux + Docker
#
# TASARIM:
#   - Docker kendi iptables-nft tablolarını (ip nat, ip filter DOCKER*) yönetir; onlara DOKUNMAYIZ
#     (`flush ruleset` YOK — aksi halde port publish ve compose ağları bozulur).
#   - Yalnızca kendi `inet closedloop` tablomuzu yönetiriz (idempotent: önce sil, sonra tanımla).
#   - Egress kuralı: köprü (br-*/docker0) DIŞINA giden her paket düşer. Konteyner↔konteyner ve
#     LAN→API (DNAT sonrası köprüye forward) çalışmaya devam eder.
#
# Uygula:  sudo nft -f deploy/nftables.conf     Kalıcı: /etc/nftables.conf + systemd (After=docker.service)
# Değiştir: LAN = müşteri iç ağı, MGMT = yönetim VLAN'ı, EDGE_IF = host'un iç ağa bakan arayüzü

define LAN     = 10.0.0.0/24
define MGMT    = 10.0.99.0/24
define DOCKER  = { 172.16.0.0/12, 10.200.0.0/16 }   # docker varsayılan + compose'daki sabit alt ağlar

table inet closedloop
delete table inet closedloop

table inet closedloop {
  chain input {
    type filter hook input priority -10; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    iifname { "docker0", "br-*" } accept                          comment "konteyner→host (docker-proxy, DNS 127.0.0.11)"
    ip saddr $LAN  tcp dport 8080 accept                          comment "API"
    ip saddr $MGMT tcp dport 22   accept                          comment "SSH yönetim"
    icmp type echo-request ip saddr { $LAN, $MGMT } accept
    counter comment "dropped-in"
  }

  chain forward {
    type filter hook forward priority -10; policy drop;
    ct state established,related accept
    iifname { "docker0", "br-*" } oifname { "docker0", "br-*" } accept   comment "konteyner↔konteyner (api→vllm)"
    oifname { "docker0", "br-*" } ip saddr $LAN tcp dport 8080 accept    comment "LAN→API (publish/DNAT sonrası)"
    iifname { "docker0", "br-*" } oifname != { "docker0", "br-*" } counter log prefix "EGRESS-BLOCKED-FWD " drop
    counter comment "dropped-fwd"
  }

  chain output {
    type filter hook output priority -10; policy drop;
    oif lo accept
    ct state established,related accept
    oifname { "docker0", "br-*" } accept                          comment "host→konteyner"
    ip daddr { $LAN, $MGMT } accept                               comment "iç ağa yanıt / yönetim"
    counter log prefix "EGRESS-BLOCKED " drop                     comment "DNS dahil hiçbir dış hedef yok"
  }
}
