#!/usr/sbin/nft -f
# Hibrit (CPU + Claude API) host güvenlik duvarı.
# Dışarı yalnızca egress-proxy konteyneri (10.200.2.20) çıkabilir: TCP 443 (Anthropic) + DNS (53).
# api konteyneri (10.200.1.10, internal ağ — Docker seviyesinde de rotası yok) ve host dışarı paket ATAMAZ. Docker'ın kendi tablolarına dokunulmaz.
#   sudo nft -f deploy/nftables.cpu.conf

define LAN    = 10.0.0.0/24
define MGMT   = 10.0.99.0/24
define PROXY  = 10.200.2.20
define DNS    = { 1.1.1.1, 8.8.8.8 }   # kurumun DNS'i varsa onu yazın

table inet closedloop
delete table inet closedloop

table inet closedloop {
  chain input {
    type filter hook input priority -10; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    iifname { "docker0", "br-*" } accept
    ip saddr $LAN  tcp dport 8080 accept comment "API"
    ip saddr $MGMT tcp dport 22   accept comment "SSH"
    icmp type echo-request ip saddr { $LAN, $MGMT } accept
    counter comment "dropped-in"
  }
  chain forward {
    type filter hook forward priority -10; policy drop;
    ct state established,related accept
    iifname { "docker0", "br-*" } oifname { "docker0", "br-*" } accept        comment "konteyner↔konteyner"
    oifname { "docker0", "br-*" } ip saddr $LAN tcp dport 8080 accept          comment "LAN→API"
    ip saddr $PROXY oifname != { "docker0", "br-*" } tcp dport 443 accept      comment "PINHOLE: proxy→Anthropic 443"
    ip saddr $PROXY oifname != { "docker0", "br-*" } ip daddr $DNS udp dport 53 accept comment "proxy DNS"
    iifname { "docker0", "br-*" } oifname != { "docker0", "br-*" } counter log prefix "EGRESS-BLOCKED-FWD " drop
    counter comment "dropped-fwd"
  }
  chain output {
    type filter hook output priority -10; policy drop;
    oif lo accept
    ct state established,related accept
    oifname { "docker0", "br-*" } accept
    ip daddr { $LAN, $MGMT } accept
    counter log prefix "EGRESS-BLOCKED " drop
  }
}
