# Kapalı devre dağıtım — üretim (Linux + NVIDIA GPU)
#
# İlkeler:
#   - vllm-* konteynerleri yalnızca `internal` ağda (internal: true → egress yok, docker seviyesi)
#   - `api` hem `internal` (vllm'e erişim) hem `edge` (host'a port publish) ağında.
#     NOT: Docker, yalnızca internal ağa bağlı konteynerde `ports:` yayınlamayı desteklemez;
#     bu yüzden ikinci (edge) ağ şart. edge ağının da dışarı çıkışı host nftables ile kesilir.
#   - Sabit alt ağlar (10.200.x) → nftables/verify_no_egress bunları "iç" sayar.
#   - Model ağırlıkları önceden indirilmiş ./models altından SALT OKUNUR mount edilir.
#   - Hiçbir imaj build/çalışma anında internet gerektirmez (bkz. scripts/prepare_models.sh)
#
# Kullanım:
#   API_KEY=... API_BIND=10.0.0.5 docker compose -f deploy/docker-compose.yml up -d
#   curl -H "X-API-Key: $API_KEY" -H "X-Filename: rapor.pdf" --data-binary @rapor.pdf http://10.0.0.5:8080/jobs

name: anamnez-closed-loop

networks:
  internal:
    driver: bridge
    internal: true          # ← egress yok
    ipam:
      config: [{ subnet: 10.200.1.0/24 }]
  edge:
    driver: bridge          # yalnızca port publish için; egress nftables ile kesilir
    ipam:
      config: [{ subnet: 10.200.2.0/24 }]

volumes:
  service-data:

x-vllm-common: &vllm-common
  # VLLM_TAG: GLM-OCR / PaddleOCR-VL model kartındaki MINIMUM vLLM sürümüne sabitleyin ve
  # prepare_models.sh'de aynı etiketi çekin. Hazırlık makinesinde `vllm serve /models/<model>` smoke testi ŞART.
  image: vllm/vllm-openai:${VLLM_TAG:-v0.19.1}   # GLM-OCR: vLLM >= 0.12 (recipes.vllm.ai/zai-org/GLM-OCR)
  restart: unless-stopped
  networks: [internal]
  shm_size: "8g"            # ipc: host yerine (host IPC namespace paylaşılmaz)
  security_opt:
    - no-new-privileges:true
  environment:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
    DO_NOT_TRACK: "1"
  volumes:
    - ./models:/models:ro
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  # ── OCR: GLM-OCR veya PaddleOCR-VL (OpenAI uyumlu /v1) ─────────────────
  vllm-ocr:
    <<: *vllm-common
    command:
      - --model=/models/glm-ocr
      - --served-model-name=glm-ocr
      - --port=8000
      - --max-model-len=8192
      - --gpu-memory-utilization=0.30
      - --limit-mm-per-prompt={"image": 1}
    healthcheck:
      # vllm imajında curl olmayabilir → python ile
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── LLM: yargıç + sınıflandırıcı (Qwen3-8B AWQ) ────────────────────────
  vllm-llm:
    <<: *vllm-common
    command:
      - --model=/models/qwen3-8b-awq
      - --served-model-name=qwen3-8b
      - --port=8000
      - --max-model-len=16384
      - --gpu-memory-utilization=0.55
      - --quantization=awq
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: anamnez-service:1.1.0
    restart: unless-stopped
    networks: [internal, edge]
    depends_on:
      vllm-ocr:  { condition: service_healthy }
      vllm-llm:  { condition: service_healthy }
    ports:
      - "${API_BIND:-127.0.0.1}:8080:8080"   # yalnızca iç arayüz; ör. API_BIND=10.0.0.5
    stop_grace_period: 60s                   # işlenmekte olan işin bitmesi için
    environment:
      ANAMNEZ_SERVER__HOST: "0.0.0.0"
      ANAMNEZ_SERVER__API_KEY_FILE: "/run/secrets/api_key"   # env yerine secret dosyası
      ANAMNEZ_STORAGE__DB_PATH: "/data/service.db"
      ANAMNEZ_OCR__BACKEND: "vision_llm"
      ANAMNEZ_OCR__VISION__BACKEND: "openai"
      ANAMNEZ_OCR__VISION__BASE_URL: "http://vllm-ocr:8000/v1"
      ANAMNEZ_OCR__VISION__MODEL: "glm-ocr"
      ANAMNEZ_LLM__BACKEND: "openai"
      ANAMNEZ_LLM__BASE_URL: "http://vllm-llm:8000/v1"
      ANAMNEZ_LLM__MODEL: "qwen3-8b"
      ANAMNEZ_LLM__TIMEOUT: "120"
    secrets: [api_key]
    volumes:
      - service-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m        # spool yok, tesseract stdin/stdout → /tmp neredeyse hiç kullanılmaz
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

secrets:
  api_key:
    file: ./api_key.txt       # `openssl rand -hex 32 > deploy/api_key.txt` (repo'ya girmez)
