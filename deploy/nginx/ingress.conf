# Ingress: iç ağdan gelen istekleri api konteynerine iletir. api konteyneri yalnızca 'internal' ağdadır
# (internete rotası YOK); bu sayede nftables olmasa bile api dışarı paket atamaz.
server {
    listen 8080;
    client_max_body_size 60m;
    proxy_read_timeout 600s;
    location / {
        proxy_pass http://10.200.1.10:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering on;    # RAM'de tamponlar; disk spool için client_body_temp_path tmpfs'te (aşağıda)
    }
}
